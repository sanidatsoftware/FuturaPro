# FuturaPro: database, server e Caddy (HTTPS). La configurazione sta in .env e
# Caddyfile, che crea installa.sh: non modificarli a mano senza motivo.
name: futurapro

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${FP_DB_SUPERPASSWORD:?manca .env}
      FP_DB_PASSWORD: ${FP_DB_PASSWORD:?manca .env}
    volumes:
      - db:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  app:
    build: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &ambiente
      FUTURAPRO_SECRET_KEY: ${FP_SECRET_KEY}
      FUTURAPRO_DB_HOST: db
      FUTURAPRO_DB_NAME: futurapro
      FUTURAPRO_DB_USER: futurapro
      FUTURAPRO_DB_PASSWORD: ${FP_DB_PASSWORD}
      # localhost: solo per il controllo di prontezza dall'interno del container.
      FUTURAPRO_ALLOWED_HOSTS: ${FP_INDIRIZZO},localhost
      FUTURAPRO_ORIGINI: https://${FP_INDIRIZZO}
      FUTURAPRO_MAX_UPLOAD_MB: ${FP_MAX_UPLOAD_MB:-2048}
      # Facoltativi: server email per gli allarmi degli schermi.
      FUTURAPRO_EMAIL_HOST: ${FP_EMAIL_HOST:-}
      FUTURAPRO_EMAIL_PORT: ${FP_EMAIL_PORT:-587}
      FUTURAPRO_EMAIL_UTENTE: ${FP_EMAIL_UTENTE:-}
      FUTURAPRO_EMAIL_PASSWORD: ${FP_EMAIL_PASSWORD:-}
      FUTURAPRO_EMAIL_MITTENTE: ${FP_EMAIL_MITTENTE:-}
      # Facoltativo: l'indirizzo pubblico per la coda sul telefono (es. https://coda.miodominio.it).
      FUTURAPRO_URL_PUBBLICO: ${FP_URL_PUBBLICO:-}
    volumes:
      - media:/dati/media
      - static:/dati/static

  # I lavori periodici, ogni minuto: allarmi degli schermi scollegati e rapporti per email.
  pianificatore:
    build: ../server
    restart: unless-stopped
    depends_on: [app]
    environment: *ambiente
    entrypoint: ["python", "manage.py", "pianificatore"]
    volumes:
      - media:/dati/media

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./installa:/srv/installa:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  media:
  static:
  caddy_data:
  caddy_config:
