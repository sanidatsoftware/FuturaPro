# FuturaPro: database, server e Caddy (HTTPS). La configurazione sta in .env e
# Caddyfile, che crea installa.sh: non modificarli a mano senza motivo.
name: futurapro

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${FP_DB_SUPERPASSWORD:?manca .env}
      FP_DB_PASSWORD: ${FP_DB_PASSWORD:?manca .env}
    volumes:
      - db:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  app:
    build: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &ambiente
      FUTURAPRO_SECRET_KEY: ${FP_SECRET_KEY}
      FUTURAPRO_DB_HOST: db
      FUTURAPRO_DB_NAME: futurapro
      FUTURAPRO_DB_USER: futurapro
      FUTURAPRO_DB_PASSWORD: ${FP_DB_PASSWORD}
      # localhost: solo per il controllo di prontezza dall'interno del container.
      FUTURAPRO_ALLOWED_HOSTS: ${FP_INDIRIZZO},localhost
      FUTURAPRO_ORIGINI: https://${FP_INDIRIZZO}
      FUTURAPRO_MAX_UPLOAD_MB: ${FP_MAX_UPLOAD_MB:-2048}
      # Facoltativi: server email per gli allarmi degli schermi.
      FUTURAPRO_EMAIL_HOST: ${FP_EMAIL_HOST:-}
      FUTURAPRO_EMAIL_PORT: ${FP_EMAIL_PORT:-587}
      FUTURAPRO_EMAIL_UTENTE: ${FP_EMAIL_UTENTE:-}
      FUTURAPRO_EMAIL_PASSWORD: ${FP_EMAIL_PASSWORD:-}
      FUTURAPRO_EMAIL_MITTENTE: ${FP_EMAIL_MITTENTE:-}
      # Facoltativo: l'indirizzo pubblico per la coda sul telefono (es. https://coda.miodominio.it).
      FUTURAPRO_URL_PUBBLICO: ${FP_URL_PUBBLICO:-}
      # Il certificato interno di Caddy (se c'è), letto dove lo scaricano i player: il pannello ne
      # mostra l'impronta nel comando di installazione, che così la controlla da solo. (La cartella
      # di Caddy non è leggibile dall'utente dell'app: per questo non si legge il file.)
      FUTURAPRO_CA_URL: http://caddy/futurapro-ca.crt
      # L'indirizzo con cui monitor e totem raggiungono il server (per lo stesso comando).
      FUTURAPRO_INDIRIZZO: ${FP_INDIRIZZO}
      # Il numero di build (commit) della versione mostrata nel pannello: lo scrive aggiorna.sh.
      FUTURAPRO_BUILD: ${FP_BUILD:-}
      FUTURAPRO_BUILD_DATA: ${FP_BUILD_DATA:-}
      # Controllo Remoto: MeshCentral nella rete interna e la chiave dei gettoni (la stessa sotto).
      FUTURAPRO_MESH_URL: http://meshcentral:4430/mesh/
      FUTURAPRO_MESH_CHIAVE: ${FP_MESH_CHIAVE:-}
    volumes:
      - media:/dati/media
      - static:/dati/static

  # I lavori periodici, ogni minuto: allarmi degli schermi scollegati, rapporti per email e
  # controllo delle dirette del plugin «Filtro contenuti».
  pianificatore:
    build: ../server
    restart: unless-stopped
    depends_on: [app]
    environment: *ambiente
    entrypoint: ["python", "manage.py", "pianificatore"]
    volumes:
      - media:/dati/media

  # Controllo Remoto (teleassistenza dei PC dei negozi): MeshCentral, pubblicato da Caddy sotto
  # https://SERVER/mesh/. Non ha porte verso l'esterno: lo raggiunge solo Caddy.
  meshcentral:
    build: ./meshcentral
    restart: unless-stopped
    environment:
      FP_INDIRIZZO: ${FP_INDIRIZZO}
      FP_MESH_CHIAVE: "${FP_MESH_CHIAVE:?manca FP_MESH_CHIAVE in .env, rilancia aggiorna.sh}"
    volumes:
      # Contiene i certificati che gli agenti riconoscono: perderlo vuol dire reinstallare gli agenti.
      - mesh_dati:/opt/meshcentral/meshcentral-data
      - mesh_file:/opt/meshcentral/meshcentral-files

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./installa:/srv/installa:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mesh_dati:
  mesh_file:
  db:
  media:
  static:
  caddy_data:
  caddy_config:
