name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FUTURAPRO_DEBUG: "1"
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Ruolo del database senza privilegi
        run: psql -h localhost -U postgres -f sviluppo/crea-ruolo.sql
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --database default
      - run: python manage.py test

  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regole del palinsesto (stesse del server)
        run: node --test server/player/static/player/regole.test.mjs
