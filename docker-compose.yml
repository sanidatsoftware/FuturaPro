# Ambiente di sviluppo: solo il database. Il pacchetto di produzione arriverà più avanti.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dati:/var/lib/postgresql/data
      - ./server/sviluppo/crea-ruolo.sql:/docker-entrypoint-initdb.d/crea-ruolo.sql:ro

volumes:
  dati:
