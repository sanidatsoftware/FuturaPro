{% load static %}<!doctype html>
<html lang="it" data-tema="{{ tema }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pannello · {{ aspetto.nome_app }}</title>
  {% if aspetto.icona %}<link rel="icon" href="/aspetto/icona/?v={{ aspetto.modificato|date:'U' }}">{% endif %}
  <link rel="stylesheet" href="{% static 'pannello/pannello.css' %}">
</head>
<body>
  <header class="barra" style="background: {{ aspetto.colore }}">
    <strong class="marchio{% if logo_riquadro %} con-riquadro{% endif %}">{% if aspetto.icona %}<img class="icona" src="/aspetto/icona/?v={{ aspetto.modificato|date:'U' }}" alt="">{% elif aspetto.logo %}<img src="/aspetto/logo/?v={{ aspetto.modificato|date:'U' }}" alt="">{% endif %}{{ aspetto.nome_app }}</strong>
    <label id="scelta-cliente" hidden>Cliente <select id="cliente"></select></label>
    <span class="spazio"></span>
    <span id="utente" class="utente"></span>
    <form method="post" action="/api/sessione/logout/?next=/pannello/">{% csrf_token %}<button class="esci">Esci</button></form>
  </header>
  <nav id="schede" class="schede"></nav>
  <div id="messaggio" class="messaggio" hidden></div>
  <main id="contenuto" class="contenuto"></main>
  <script type="module" src="{% static 'pannello/pannello.js' %}"></script>
</body>
</html>
