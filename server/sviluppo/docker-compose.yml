# Ambiente di sviluppo: solo il database. Per installare FuturaPro vedi docs/INSTALLAZIONE.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dati:/var/lib/postgresql/data
      - ./crea-ruolo.sql:/docker-entrypoint-initdb.d/crea-ruolo.sql:ro

volumes:
  dati:
