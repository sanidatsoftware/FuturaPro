<!DOCTYPE html>
{% load static %}
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}Documenti Amministrativi{% endblock %}</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#263238}
.header{background:#fff;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.logo img{height:68px}.user-box{text-align:right;font-size:14px}.user-box strong{display:block;font-size:16px}.user-box a{color:#ff6a00;text-decoration:none;font-weight:bold}
.container{padding:22px;width:98%;max-width:1960px;margin:auto}
.top-actions{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.top-actions h1{color:#2d4055;margin:0;flex:1;min-width:260px}
.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:bold;text-decoration:none;cursor:pointer;display:inline-block;font-size:14px}
.btn-orange{background:#ff6a00;color:#fff}.btn-dark{background:#2d4055;color:#fff}.btn-light{background:#fff;color:#2d4055;border:1px solid #ced7e2}.btn-red{background:#c62828;color:#fff}
.btn.active{outline:3px solid rgba(255,106,0,.35)}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.08);margin-bottom:18px}
.card h2,.card h3{margin-top:0;color:#2d4055}
.filters{display:flex;gap:11px;align-items:end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:bold;color:#2d4055}
input,select,textarea{padding:9px;border:1px solid #ced7e2;border-radius:8px;font-size:14px;background:#fff;font-family:inherit}
textarea{min-height:80px;resize:vertical;width:100%}
.check{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:bold;color:#2d4055}
.table{width:100%;border-collapse:collapse;background:#fff}
.table th{background:#2d4055;color:#fff;text-align:left;padding:10px;font-size:13px}
.table td{border-bottom:1px solid #eee;padding:9px 10px;vertical-align:top;font-size:14px}
.table tr.group td{background:#eef2f7;font-weight:bold;color:#2d4055}
.badge{padding:4px 9px;border-radius:16px;font-size:12px;font-weight:bold;display:inline-block;white-space:nowrap}
.badge-no{background:#fff3cd;color:#856404}.badge-ok{background:#d4edda;color:#155724}.badge-red{background:#f8d7da;color:#721c24}.badge-grey{background:#eef2f7;color:#2d4055}
.message-ok{background:#d4edda;color:#155724;padding:12px;border-radius:8px;margin-bottom:16px}
.message-error{background:#f8d7da;color:#721c24;padding:12px;border-radius:8px;margin-bottom:16px}
.small{font-size:12px;color:#667085}
/* Anteprime SysSpy: Consolas Regular 11 pt, colonne fisse come sulla stampa di cassa. */
.mono{font-family:Consolas,"Lucida Console","Courier New",monospace;font-size:11pt;font-weight:400;white-space:pre;overflow:auto;background:#fff;border:1px solid #d9e0e8;border-radius:8px;padding:12px;line-height:1.25;max-height:640px;color:#111}
.grid2{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:18px;align-items:start}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.nav{display:flex;gap:8px;flex-wrap:wrap}
/* Finestra della stampa: il PDF si apre sopra la pagina, senza nuove schede. */
.stampa-overlay{position:fixed;inset:0;z-index:9999;background:rgba(36,59,85,.72);display:none;align-items:center;justify-content:center}
.stampa-box{background:#fff;border-radius:14px;width:min(1100px,96vw);height:92vh;display:flex;flex-direction:column;box-shadow:0 12px 35px rgba(0,0,0,.3)}
.stampa-barra{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #e1e7ee}
.stampa-barra strong{flex:1;color:#2d4055}
.stampa-box iframe{flex:1;border:0;border-radius:0 0 14px 14px;width:100%}
/* Schede delle sezioni (Documenti Amministrativi, Statistiche). */
.sezioni{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.sezione-card{background:#fff;border-radius:14px;padding:26px;box-shadow:0 4px 16px rgba(0,0,0,.08);text-decoration:none;color:#263238;
    border:2px solid transparent;transition:border-color .15s,transform .15s}
.sezione-card:hover{border-color:#ff6a00;transform:translateY(-2px)}
.sezione-card .icona{font-size:34px}.sezione-card h2{color:#2d4055;margin:10px 0 6px}
.sezione-card p{margin:0;color:#667085;font-size:14px}
.sezione-card .badge{margin-top:12px}
.stampa-attesa{flex:1;display:flex;align-items:center;justify-content:center;color:#667085}
/* Elaborazione in corso: pannello con indicatore e secondi trascorsi durante le ricerche lunghe. */
.attesa-overlay{position:fixed;inset:0;z-index:9998;background:rgba(36,59,85,.45);display:flex;align-items:center;justify-content:center}
.attesa-box{background:#fff;border-radius:14px;padding:26px 30px;min-width:320px;max-width:90vw;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.25)}
.attesa-box strong{display:block;color:#2d4055;font-size:17px;margin-top:14px}
.attesa-tempo{font-size:30px;font-weight:bold;color:#2d4055;font-variant-numeric:tabular-nums;margin:6px 0}
.attesa-nota{font-size:12px;color:#667085;min-height:16px}
.attesa-ruota{width:42px;height:42px;border:4px solid #cde2fb;border-top-color:#2a78d6;border-radius:50%;margin:0 auto;animation:attesa-giro .9s linear infinite}
@keyframes attesa-giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.attesa-ruota{animation-duration:3s}}
</style>
{% block style %}{% endblock %}
</head>
<body>
<div class="header">
    <div class="logo"><img src="{% static 'img/logo_tocal_fondo_bianco.jpg' %}" alt="TOCAL"></div>
    <div class="user-box">
        <strong>{{ utente.field_2250 }}</strong>
        <span>{{ utente.field_2253.value }}</span><br>
        <a href="/menu/">Menu</a> | <a href="/logout/">Esci</a>
    </div>
</div>
<div class="container">
{% block content %}{% endblock %}
</div>
<script>
function csrfToken(){ return document.querySelector('meta[name="csrf-token"]').content; }
function postJson(url, body){
    return fetch(url, {method:"POST", headers:{"Content-Type":"application/json","X-CSRFToken":csrfToken()},
                       credentials:"same-origin", body:JSON.stringify(body||{})})
        .then(r => r.json().catch(() => ({error:"Risposta non valida dal server"})));
}
function toggleLavorato(id, checkbox, versamento){
    checkbox.disabled = true;
    postJson(`/primanota/update-lavorato/${id}/`, {lavorato:checkbox.checked, versamento:!!versamento})
        .then(data => {
            checkbox.disabled = false;
            if(data.error){ alert(data.error); checkbox.checked = !checkbox.checked; return; }
            const badge = document.getElementById((versamento ? "vers-status-" : "scan-status-") + id);
            if(badge){
                badge.className = "badge " + (checkbox.checked ? "badge-ok" : "badge-no");
                badge.innerText = checkbox.checked ? (versamento ? "Versamento lavorato" : "Lavorato")
                                                   : (versamento ? "Versamento da lavorare" : "Non lavorato");
            }
        })
        .catch(() => { checkbox.disabled = false; checkbox.checked = !checkbox.checked; alert("Errore aggiornamento lavorato."); });
}
function apriStampa(url){
    let overlay = document.getElementById("stampaOverlay");
    if(!overlay){
        overlay = document.createElement("div");
        overlay.id = "stampaOverlay";
        overlay.className = "stampa-overlay";
        overlay.innerHTML = `<div class="stampa-box"><div class="stampa-barra"><strong>Stampa</strong>
            <button class="btn btn-orange" id="stampaStampa" disabled>Stampa</button>
            <a class="btn btn-dark" id="stampaScarica" style="display:none">Scarica PDF</a>
            <button class="btn btn-light" id="stampaChiudi">Chiudi</button></div>
            <div class="stampa-attesa" id="stampaAttesa">Preparazione del PDF in corso…</div></div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener("click", e => { if(e.target === overlay) chiudiStampa(); });
        document.getElementById("stampaChiudi").addEventListener("click", chiudiStampa);
        document.getElementById("stampaStampa").addEventListener("click", () => {
            const f = overlay.querySelector("iframe");
            try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e) { alert("Usare il pulsante di stampa del visualizzatore PDF."); }
        });
        document.addEventListener("keydown", e => { if(e.key === "Escape") chiudiStampa(); });
    }
    const box = overlay.querySelector(".stampa-box");
    overlay.querySelector("iframe")?.remove();
    const attesa = document.getElementById("stampaAttesa");
    attesa.style.display = "flex";
    const inizio = Date.now();
    const aggiorna = () => { attesa.textContent = `Preparazione del PDF in corso… ${durata(Date.now() - inizio)}`; };
    aggiorna();
    clearInterval(window.timerStampa);
    window.timerStampa = setInterval(aggiorna, 1000);
    document.getElementById("stampaStampa").disabled = true;
    document.getElementById("stampaScarica").style.display = "none";
    // Il PDF si scarica prima e poi si mostra: così si sa quando è pronto e si vedono gli errori.
    fetch(url, {credentials: "same-origin"})
        .then(async r => {
            if(!r.ok) throw new Error((await r.text()).slice(0, 200) || ("Errore " + r.status));
            // Nome del file deciso dal portale (sezione, negozio, date).
            const m = /filename="([^"]+)"/.exec(r.headers.get("Content-Disposition") || "");
            return {pdf: await r.blob(), nome: m ? m[1] : "chiusure.pdf"};
        })
        .then(({pdf, nome}) => {
            const frame = document.createElement("iframe");
            frame.src = URL.createObjectURL(pdf);
            frame.title = nome;
            const scarica = document.getElementById("stampaScarica");
            scarica.href = frame.src;
            scarica.download = nome;
            scarica.style.display = "inline-block";
            overlay.querySelector(".stampa-barra strong").textContent = nome;
            clearInterval(window.timerStampa);
            attesa.style.display = "none";
            box.appendChild(frame);
            document.getElementById("stampaStampa").disabled = false;
        })
        .catch(err => { clearInterval(window.timerStampa); attesa.textContent = "Stampa non riuscita: " + err.message; });
    overlay.style.display = "flex";
    return false;
}
function chiudiStampa(){
    const overlay = document.getElementById("stampaOverlay");
    const frame = overlay && overlay.querySelector("iframe");
    if(frame){ URL.revokeObjectURL(frame.src); frame.remove(); }
    if(overlay) overlay.style.display = "none";
}
function deleteScansione(id){
    if(!confirm("Confermi l'eliminazione del documento?")) return;
    postJson(`/primanota/delete/${id}/`).then(data => { if(data.error) alert(data.error); else location.reload(); });
}
// Moduli con data-attesa: all'invio si mostra «Elaborazione in corso» con i secondi trascorsi,
// finché arriva la pagina con i risultati. «Interrompi» ferma il caricamento.
function durata(ms){
    const s = Math.floor(ms / 1000);
    return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s`;
}
function mostraAttesa(testo){
    let overlay = document.getElementById("attesaOverlay");
    if(!overlay){
        overlay = document.createElement("div");
        overlay.id = "attesaOverlay";
        overlay.className = "attesa-overlay";
        overlay.setAttribute("role", "status");
        overlay.innerHTML = `<div class="attesa-box"><div class="attesa-ruota"></div><strong id="attesaTesto"></strong>
            <div class="attesa-tempo" id="attesaTempo">0 s</div><div class="attesa-nota" id="attesaNota"></div>
            <button type="button" class="btn btn-light" style="margin-top:12px" id="attesaStop">Interrompi</button></div>`;
        document.body.appendChild(overlay);
        document.getElementById("attesaStop").addEventListener("click", () => { window.stop(); nascondiAttesa(); });
    }
    document.getElementById("attesaTesto").textContent = testo || "Elaborazione in corso…";
    document.getElementById("attesaNota").textContent = "";
    overlay.style.display = "flex";
    const inizio = Date.now();
    clearInterval(window.timerAttesa);
    window.timerAttesa = setInterval(() => {
        const ms = Date.now() - inizio;
        document.getElementById("attesaTempo").textContent = durata(ms);
        if(ms > 20000) document.getElementById("attesaNota").textContent =
            "Con molti giorni o punti vendita la ricerca può richiedere qualche minuto.";
    }, 1000);
}
function nascondiAttesa(){
    clearInterval(window.timerAttesa);
    const overlay = document.getElementById("attesaOverlay");
    if(overlay) overlay.style.display = "none";
}
document.addEventListener("submit", e => {
    const form = e.target;
    if(!form.dataset || form.dataset.attesa === undefined) return;
    setTimeout(() => { if(!e.defaultPrevented) mostraAttesa(form.dataset.attesa); }, 0);
});
// Tornando indietro col browser la pagina può riapparire dalla cache: niente pannello rimasto aperto.
window.addEventListener("pageshow", nascondiAttesa);
</script>
{% block script %}{% endblock %}
</body>
</html>
