{# Icone a linea (24×24, colore del testo) per i menu. Vuole nome; dimensione facoltativa (predefinita 18). #}

     stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

{% endif %}</svg>
