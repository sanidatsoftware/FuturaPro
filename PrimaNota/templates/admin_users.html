{% extends 'base.html' %}{% block content %}<h1>Utenti e permessi</h1><form method=post class=card><input name=username required placeholder=Utente> <input type=password name=password required placeholder=Password> <label><input type=checkbox name=is_admin> Amministratore</label> <label><input type=checkbox name=can_legacy> Abilita Ricerca Matricole</label> <button>Crea utente</button></form><div class=card><table><tr><th>Utente</th><th>Admin</th><th>Ricerca Matricole</th><th></th></tr>{% for r in rows %}<tr><td>{{r.username}}</td><td>{{'SI' if r.is_admin else 'NO'}}</td><td>{{'SI' if r.can_legacy else 'NO'}}</td><td><form method=post action="{{url_for('toggle_legacy',uid=r.id)}}"><button>Abilita/Disabilita modulo</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
