{% extends 'base.html' %}{% block content %}<h1>Utenti e permessi</h1><form method=post class=card><input type=hidden name=csrf_token value="{{csrf_token()}}"><input name=username required placeholder=Utente> <input type=password name=password required placeholder=Password> <label><input type=checkbox name=is_admin> Amministratore</label> <label><input type=checkbox name=can_legacy> Abilita Ricerca Matricole</label> <button>Crea utente</button></form><div class=card><table><tr><th>Utente</th><th>Admin</th><th>Ricerca Matricole</th><th>Attivo</th><th></th></tr>{% for r in rows %}<tr><td>{{r.username}}</td><td>{{'SI' if r.is_admin else 'NO'}}</td><td>{{'SI' if r.can_legacy else 'NO'}}</td><td>{{'SI' if r.active else 'NO'}}</td><td><form method=post action="{{url_for('toggle_legacy',uid=r.id)}}"><input type=hidden name=csrf_token value="{{csrf_token()}}"><button>Abilita/Disabilita modulo</button></form> <form method=post action="{{url_for('toggle_active',uid=r.id)}}"><input type=hidden name=csrf_token value="{{csrf_token()}}"><button class=danger>{{'Disattiva' if r.active else 'Riattiva'}}</button></form> <form method=post action="{{url_for('set_password',uid=r.id)}}"><input type=hidden name=csrf_token value="{{csrf_token()}}"><input type=password name=password minlength=8 required placeholder="Nuova password"> <button>Cambia</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
