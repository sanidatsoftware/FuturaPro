{% extends 'base.html' %}{% block content %}<h1>Archivio SysSpy</h1><form class="card"><select name=store_id><option value="">Tutti i negozi</option>{% for s in stores %}<option value="{{s.id}}">{{s.code}} - {{s.name}}</option>{% endfor %}</select> <input type=date name=dal> <input type=date name=al> <button>Filtra</button></form><div class="card" style="overflow:auto"><table><tr><th>Data</th><th>Negozio</th><th>Cassa</th><th>File</th><th>POS</th><th>Fiscale</th><th>Scontrini</th><th></th></tr>{% for r in rows %}<tr><td>{{r.business_date}}</td><td>{{r.store_code}}</td><td>{{r.register_no}}</td><td>{{r.file_name}}</td><td>{{r.pos_total}}</td><td>{{r.fiscal_total}}</td><td>{{r.num_scontrini}}</td><td><a class=btn href="{{url_for('archive_detail',file_id=r.id)}}">Apri</a></td></tr>{% endfor %}</table></div>{% endblock %}
