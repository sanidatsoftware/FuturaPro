{% extends 'base.html' %}{% block content %}<h1>Ricerca nei files SysSpy</h1><form class=card><input name=q value="{{term}}" placeholder="Parole chiave, numero scontrino, importo..." style="width:420px"><select name=store_id><option value="">Tutti i negozi</option>{% for s in stores %}<option value="{{s.id}}" {% if store_id|string==s.id|string %}selected{% endif %}>{{s.code}} - {{s.name}}</option>{% endfor %}</select> <button>Cerca</button></form>{% if term %}<div class=card><b>{{rows|length}}</b> risultati per “{{term}}”</div>{% endif %}<div class=card><table><tr><th>Data</th><th>Negozio</th><th>Cassa</th><th>File</th><th></th></tr>{% for r in rows %}<tr><td>{{r.business_date}}</td><td>{{r.store_code}}</td><td>{{r.register_no}}</td><td>{{r.file_name}}</td><td><a class=btn href="{{url_for('archive_detail',file_id=r.id)}}">Apri</a></td></tr>{% endfor %}</table></div>{% endblock %}
