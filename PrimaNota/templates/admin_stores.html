{% extends 'base.html' %}{% block content %}<h1>Negozi e condivisioni</h1><p>Per modificare un negozio reinserire lo stesso codice.</p><form method=post class=card><input type=hidden name=csrf_token value="{{csrf_token()}}"><div class=grid><input name=code required placeholder="Codice negozio"><input name=name required placeholder="Descrizione"><input name=share_path placeholder="Percorso locale o \\server\share"><input name=share_user placeholder="Utente share"><input name=share_password type=password placeholder="Password share (vuota = invariata)"></div><p><button>Salva negozio</button></p></form><div class=card><table><tr><th>Codice</th><th>Nome</th><th>Percorso</th><th>Utente</th><th>Archiviazione</th></tr>{% for r in rows %}<tr><td>{{r.code}}</td><td>{{r.name}}</td><td>{{r.share_path}}</td><td>{{r.share_user}}</td><td><form method=post action="{{url_for('start_import',store_id=r.id)}}"><input type=hidden name=csrf_token value="{{csrf_token()}}"><button>Importa nuovi/pregresso</button> <button class=danger name=full value=1 onclick="return confirm('Rileggere e riarchiviare tutti i file del negozio?')">Ricostruisci</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
