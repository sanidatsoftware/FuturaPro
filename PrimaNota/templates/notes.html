{% extends 'base.html' %}{% block content %}<h1>Note e anomalie</h1><form method=post class=card><select name=store_id>{% for s in stores %}<option value={{s.id}}>{{s.code}} - {{s.name}}</option>{% endfor %}</select> <input type=date name=business_date required> <select name=note_type><option>NOTA</option><option>ANOMALIA</option><option>RICHIESTA_CONTATTO</option></select><p><textarea name=body rows=4 style="width:100%" required placeholder="Descrizione"></textarea></p><button>Inserisci</button></form><div class=card><table><tr><th>Data</th><th>Negozio</th><th>Tipo</th><th>Nota</th><th>Utente</th></tr>{% for r in rows %}<tr><td>{{r.business_date}}</td><td>{{r.store_code}}</td><td class="{{'bad' if r.note_type!='NOTA' else ''}}">{{r.note_type}}</td><td>{{r.body}}</td><td>{{r.username}}</td></tr>{% endfor %}</table></div>{% endblock %}
