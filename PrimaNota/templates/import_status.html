{% extends 'base.html' %}{% block content %}<h1>Archiviazione pregresso</h1><div class=card><div id=s>Avvio...</div><p><button class=danger onclick="fetch('/api/jobs/{{job_id}}/stop',{method:'POST'})">STOP</button></p></div><script>async function poll(){let r=await fetch('/api/jobs/{{job_id}}');let j=await r.json();document.getElementById('s').innerHTML=`Stato: <b>${j.state}</b><br>Files esaminati: ${j.seen||0}<br>Importati: ${j.imported||0}<br>Già presenti: ${j.skipped||0}<br>Errori: ${j.errors||0}<br>${j.message||''}`;if(j.state==='running')setTimeout(poll,1000)}poll()</script>{% endblock %}
